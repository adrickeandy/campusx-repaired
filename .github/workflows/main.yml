name: CampusX Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # FLUTTER
      # =========================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      # =========================
      # DEPENDENCIES
      # =========================

      - name: Install dependencies
        run: flutter pub get

      # =========================
      # ANDROID APK
      # =========================

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # =========================
      # WINDOWS BUILD
      # =========================

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=env.json

      # =========================
      # INNO SETUP
      # =========================

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\campusx.iss"

      # =========================
      # UPLOAD WINDOWS INSTALLER
      # =========================

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows-Installer
          path: installer/Output/*.exe

      # =========================
      # UPLOAD WINDOWS PORTABLE
      # =========================

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows
          path: build/windows/x64/runner/Release/
