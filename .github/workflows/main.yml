name: CampusX Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # SETUP FLUTTER
      # =========================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================
      # VERIFY FLUTTER
      # =========================

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

            # =========================
      # GENERATE ANDROID PROJECT
      # =========================

      - name: Generate Android project
        run: flutter create --platforms=android .

      # =========================
      # CONFIGURE ANDROID SDK
      # =========================

      - name: Configure Android compile SDK
        shell: powershell
        run: |
          $buildGradle = "android\app\build.gradle"

          if (!(Test-Path $buildGradle)) {
            Write-Error "android/app/build.gradle was not found."
            exit 1
          }

          $content = Get-Content $buildGradle -Raw

          $content = $content -replace `
            'compileSdk\s*=\s*flutter\.compileSdkVersion', `
            'compileSdk = 36'

          $content = $content -replace `
            'compileSdkVersion\s+flutter\.compileSdkVersion', `
            'compileSdkVersion 36'

          Set-Content $buildGradle $content

          Write-Host "Updated compileSdk to 36."
          Write-Host ""
          Get-Content $buildGradle

      # =========================
      # DISABLE KOTLIN INCREMENTAL
      # =========================

      - name: Configure Kotlin Build
        shell: powershell
        run: |
          $props = "android\gradle.properties"

          if (!(Test-Path $props)) {
            New-Item -ItemType File -Path $props -Force | Out-Null
          }

          $content = Get-Content $props -ErrorAction SilentlyContinue

          if ($content -notmatch "^kotlin\.incremental=") {
            Add-Content $props "kotlin.incremental=false"
          }

          if ($content -notmatch "^kotlin\.incremental\.useClasspathSnapshot=") {
            Add-Content $props "kotlin.incremental.useClasspathSnapshot=false"
          }

          Write-Host "Kotlin incremental compilation disabled."
          Write-Host ""
          Get-Content $props

      # =========================
      # CLEAN GENERATED BUILD DATA
      # =========================

      - name: Clean Flutter Build
        shell: powershell
        run: |
          flutter clean

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          Write-Host "Flutter build directory cleaned."

      # =========================
      # INSTALL DEPENDENCIES
      # =========================

      - name: Install dependencies
        run: flutter pub get

      # =========================
      # ANDROID APK
      # =========================

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=env.json

      # =========================
      # UPLOAD ANDROID APK
      # =========================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # =========================
      # WINDOWS BUILD
      # =========================

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=env.json

      # =========================
      # INSTALL INNO SETUP
      # =========================

      - name: Install Inno Setup
        run: choco install innosetup -y

      # =========================
      # BUILD WINDOWS INSTALLER
      # =========================

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\campusx.iss"

      # =========================
      # UPLOAD WINDOWS INSTALLER
      # =========================

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows-Installer
          path: installer/Output/*.exe

      # =========================
      # UPLOAD WINDOWS PORTABLE
      # =========================

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows
          path: build/windows/x64/runner/Release/
