name: CampusX Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # SETUP FLUTTER
      # =========================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================
      # VERIFY FLUTTER
      # =========================

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      # =========================
      # VERIFY PROJECT
      # =========================

      - name: Verify Flutter Project
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Project files:"
          Get-ChildItem -Force

          if (!(Test-Path "pubspec.yaml")) {
            Write-Error "pubspec.yaml was not found. This is not a Flutter project root."
            exit 1
          }

          Write-Host ""
          Write-Host "Flutter project verified."

      # =========================
      # GENERATE / REPAIR ANDROID
      # =========================

      - name: Generate Android project
        shell: powershell
        run: |
          Write-Host "Generating Android project..."

          flutter create --platforms=android .

          if (!(Test-Path "android")) {
            Write-Error "Android project was not generated."
            exit 1
          }

          if (Test-Path "android\app\build.gradle") {
            Write-Host "Found android/app/build.gradle"
          }
          elseif (Test-Path "android\app\build.gradle.kts") {
            Write-Host "Found android/app/build.gradle.kts"
          }
          else {
            Write-Host ""
            Write-Host "Contents of android/app:"
            if (Test-Path "android\app") {
              Get-ChildItem "android\app" -Force
            }

            Write-Error "No Android app Gradle build file was found."
            exit 1
          }

      # =========================
      # CONFIGURE ANDROID SDK
      # =========================

      - name: Configure Android compile SDK
        shell: powershell
        run: |
          $buildGradle = $null

          if (Test-Path "android\app\build.gradle") {
            $buildGradle = "android\app\build.gradle"
          }
          elseif (Test-Path "android\app\build.gradle.kts") {
            $buildGradle = "android\app\build.gradle.kts"
          }

          if ($null -eq $buildGradle) {
            Write-Host ""
            Write-Host "android/app contents:"
            Get-ChildItem "android\app" -Force

            Write-Error "Neither android/app/build.gradle nor android/app/build.gradle.kts was found."
            exit 1
          }

          Write-Host "Using Gradle file:"
          Write-Host $buildGradle

          $content = Get-Content $buildGradle -Raw

          # Flutter Kotlin DSL
          $content = $content -replace `
            'compileSdk\s*=\s*flutter\.compileSdkVersion', `
            'compileSdk = 36'

          # Flutter Groovy DSL
          $content = $content -replace `
            'compileSdkVersion\s+flutter\.compileSdkVersion', `
            'compileSdkVersion 36'

          # Existing Kotlin DSL numeric compileSdk
          $content = $content -replace `
            'compileSdk\s*=\s*\d+', `
            'compileSdk = 36'

          # Existing Groovy numeric compileSdkVersion
          $content = $content -replace `
            'compileSdkVersion\s+\d+', `
            'compileSdkVersion 36'

          Set-Content $buildGradle $content -Encoding UTF8

          Write-Host ""
          Write-Host "Android compileSdk configured to 36."
          Write-Host ""
          Write-Host "Final Gradle configuration:"
          Get-Content $buildGradle

      # =========================
      # CONFIGURE KOTLIN
      # =========================

      - name: Configure Kotlin Build
        shell: powershell
        run: |
          $props = "android\gradle.properties"

          if (!(Test-Path $props)) {
            New-Item -ItemType File -Path $props -Force | Out-Null
          }

          $content = Get-Content $props -Raw -ErrorAction SilentlyContinue

          if ($content -notmatch '(?m)^kotlin\.incremental=') {
            Add-Content $props "kotlin.incremental=false"
          }

          if ($content -notmatch '(?m)^kotlin\.incremental\.useClasspathSnapshot=') {
            Add-Content $props "kotlin.incremental.useClasspathSnapshot=false"
          }

          Write-Host "Kotlin incremental compilation disabled."
          Write-Host ""
          Get-Content $props

      # =========================
      # CONFIGURE GRADLE MEMORY
      # =========================

      - name: Configure Gradle
        shell: powershell
        run: |
          $props = "android\gradle.properties"

          $content = Get-Content $props -Raw -ErrorAction SilentlyContinue

          if ($content -notmatch '(?m)^org\.gradle\.jvmargs=') {
            Add-Content $props "org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
          }

          Write-Host "Gradle configuration:"
          Write-Host ""
          Get-Content $props

      # =========================
      # VERIFY ANDROID PROJECT
      # =========================

      - name: Verify Android Configuration
        shell: powershell
        run: |
          Write-Host "Android directory:"
          Get-ChildItem "android" -Force

          Write-Host ""
          Write-Host "Android app directory:"
          Get-ChildItem "android\app" -Force

          Write-Host ""
          Write-Host "Gradle files:"
          Get-ChildItem "android" -Recurse -File |
            Where-Object {
              $_.Name -eq "build.gradle" -or
              $_.Name -eq "build.gradle.kts" -or
              $_.Name -eq "gradle.properties"
            } |
            Select-Object FullName

      # =========================
      # CLEAN BUILD DATA
      # =========================

      - name: Clean Flutter Build
        shell: powershell
        run: |
          flutter clean

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          Write-Host "Flutter build directory cleaned."

      # =========================
      # INSTALL DEPENDENCIES
      # =========================

      - name: Install dependencies
        run: flutter pub get

      # =========================
      # VERIFY ENV FILE
      # =========================

      - name: Verify Environment File
        shell: powershell
        run: |
          if (!(Test-Path "env.json")) {
            Write-Error "env.json was not found in the project root."
            exit 1
          }

          Write-Host "env.json found."

      # =========================
      # ANDROID APK
      # =========================

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=env.json

      # =========================
      # UPLOAD ANDROID APK
      # =========================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # =========================
      # WINDOWS BUILD
      # =========================

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=env.json

      # =========================
      # INSTALL INNO SETUP
      # =========================

      - name: Install Inno Setup
        run: choco install innosetup -y

      # =========================
      # BUILD WINDOWS INSTALLER
      # =========================

      - name: Build Windows Installer
        shell: powershell
        run: |
          $iss = "installer\campusx.iss"

          if (!(Test-Path $iss)) {
            Write-Error "Installer script was not found: $iss"
            exit 1
          }

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found: $iscc"
            exit 1
          }

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      # =========================
      # UPLOAD WINDOWS INSTALLER
      # =========================

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows-Installer
          path: installer/Output/*.exe

      # =========================
      # UPLOAD WINDOWS PORTABLE
      # =========================

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: CampusX-Windows
          path: build/windows/x64/runner/Release/
